name: AI Team tests and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aiteam-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Python control plane and HTTP tests
        run: PYTHONPATH=v1 python -m unittest discover -s v1/tests -p 'test_*.py' -v
      - name: Syntax checks
        run: |
          python -m compileall -q v1/agent_team_v1
          node --check v1/agent_team_v1/web/app.js
          node --check v1/agent_team_v1/web/simulation.js
      - run: npm run build:demo
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload static demo
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: test-build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish public demo
        id: deployment
        uses: actions/deploy-pages@v4
